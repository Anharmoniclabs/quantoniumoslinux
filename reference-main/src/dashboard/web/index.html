<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>QUE Guild — Control Center</title>
  <style>
    * { margin:0; padding:0; box-sizing:border-box; }
    html,body { width:100%; height:100%; background:#0a0c10; overflow:hidden; font-family:'Consolas','Courier New',monospace; color:#c0c8d0; }

    /* ── Layout: map fills left, right panel, bottom panel ── */
    #map-container {
      position:fixed;
      top:0; left:0;
      width:calc(100% - 300px);
      height:calc(100% - 220px);
      background:#0a0c10;
    }
    #map-container canvas { display:block; image-rendering:pixelated; }

    /* ── Right Panel (agent cards) ── */
    #right-panel {
      position:fixed;
      top:0; right:0;
      width:300px; height:100%;
      background:#0c0e14;
      border-left:2px solid #2a3040;
      overflow-y:auto;
      z-index:10;
    }
    .panel-header {
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:8px;
      padding:10px 10px 6px;
      border-bottom:1px solid #171b24;
      position:sticky;
      top:0;
      background:#0c0e14;
      z-index:2;
    }
    .panel-title {
      font-size:15px; font-weight:bold;
      color:#ffd700;
      letter-spacing:1px;
    }
    .ws-status {
      font-size:10px;
      font-weight:bold;
      letter-spacing:0.8px;
      padding:4px 6px;
      border-radius:999px;
      border:1px solid #2a3040;
      color:#c0c8d0;
      background:#14181e;
    }
    .ws-live { color:#9ff0a8; border-color:#2d6a3d; background:#102416; }
    .ws-connecting { color:#f7d26a; border-color:#6e5a1f; background:#221c0f; }
    .ws-offline, .ws-error { color:#ff9f9f; border-color:#7b2c2c; background:#241010; }
    #agent-cards { padding:0 8px 8px; }
    .agent-card {
      background:#10141a;
      border-radius:4px;
      padding:8px 10px 6px;
      margin-bottom:6px;
      border-left:3px solid #888;
    }
    .card-header {
      display:flex; align-items:baseline; gap:6px;
      margin-bottom:2px;
    }
    .card-name { font-size:14px; font-weight:bold; flex:1; }
    .card-class { font-size:11px; opacity:0.7; font-weight:normal; }
    .card-level { font-size:12px; color:#b0d090; }
    .card-state { font-size:11px; color:#ddaa33; }
    .state-working { color:#44dd88; }
    .state-cooldown { color:#8888aa; }
    .state-idle { color:#ddaa33; }
    .card-quest { font-size:10px; color:#556677; min-height:14px; margin-bottom:2px; }
    .bar-row { display:flex; align-items:center; gap:4px; margin:2px 0; }
    .bar-label { font-size:9px; width:16px; }
    .hp-label { color:#44bb55; }
    .xp-label { color:#5588cc; }
    .bar-bg { flex:1; height:7px; background:#1a1a1a; border-radius:2px; overflow:hidden; }
    .bar-fill { height:100%; border-radius:2px; transition:width 0.3s; }
    .hp-bar { background:#44bb55; }
    .xp-bar { background:#5588cc; }
    .card-quests-count { font-size:9px; color:#556677; margin-top:2px; }

    /* ── Bottom Panel ── */
    #bottom-panel {
      position:fixed;
      bottom:0; left:0;
      width:calc(100% - 300px);
      height:220px;
      background:#0c0e14;
      border-top:2px solid #2a3040;
      display:flex; flex-direction:column;
      z-index:10;
    }
    .btn-row {
      display:flex; gap:6px;
      padding:8px 10px 6px;
    }
    .hud-btn {
      flex:1;
      padding:8px 0;
      border:1px solid #3a4050;
      border-radius:3px;
      font-family:inherit; font-size:12px; font-weight:bold;
      color:#ddeeff;
      cursor:pointer;
      transition:filter 0.15s;
    }
    .hud-btn:hover { filter:brightness(1.3); color:#fff; }
    .btn-blue   { background:#2060cc; }
    .btn-green  { background:#208040; }
    .btn-orange { background:#cc8020; }
    .btn-purple { background:#8020cc; }

    .tab-row {
      display:flex;
      padding:0 10px;
      gap:2px;
    }
    .tab {
      flex:1;
      text-align:center;
      padding:5px 0;
      font-size:12px; color:#556677;
      background:#14181e;
      cursor:pointer;
      border-radius:3px 3px 0 0;
      transition:background 0.15s, color 0.15s;
    }
    .tab.active { background:#2a3a4a; color:#fff; }
    .tab:hover { color:#aabbcc; }

    #tab-content {
      flex:1;
      position:relative;
      overflow:hidden;
    }
    .tab-pane {
      display:none;
      position:absolute;
      top:0; left:0; right:0; bottom:0;
      padding:8px 12px;
      font-size:12px; color:#7799aa;
      line-height:1.5;
      overflow-y:auto;
      white-space:pre-wrap;
      word-break:break-word;
    }
    .tab-pane.active { display:block; }
    .tab-pane::-webkit-scrollbar { width:6px; }
    .tab-pane::-webkit-scrollbar-thumb { background:#334; border-radius:3px; }

    .chat-row {
      display:flex; gap:6px;
      padding:6px 10px 8px;
    }
    .chat-row input {
      flex:1;
      background:#10141a;
      border:1px solid #334466;
      border-radius:4px;
      padding:0 12px;
      height:32px;
      color:#e0e8f0;
      font-family:inherit; font-size:13px;
      outline:none;
    }
    .chat-row input:focus { border-color:#4488cc; }
    .chat-row .hud-btn { flex:0 0 70px; padding:0; height:32px; }

    /* Scrollbar for right panel */
    #right-panel::-webkit-scrollbar { width:6px; }
    #right-panel::-webkit-scrollbar-thumb { background:#334; border-radius:3px; }
  </style>
</head>
<body>
  <div id="map-container"></div>
  <script src="https://cdn.jsdelivr.net/npm/phaser@3.80.1/dist/phaser.min.js"></script>
  <script src="app.js?v=20260412a"></script>
</body>
</html>
