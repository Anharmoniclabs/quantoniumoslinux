<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>QuantoniumOS — R1-Distill-Qwen 7B</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#0a0e1a;--surface:#111827;--border:#1e293b;--text:#e2e8f0;--muted:#94a3b8;--accent:#00d4ff;--accent2:#6366f1;--user-bg:#1e293b;--bot-bg:#0f172a}
body{font-family:system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--text);height:100vh;display:flex;flex-direction:column}
header{display:flex;align-items:center;gap:12px;padding:16px 20px;border-bottom:1px solid var(--border);background:var(--surface)}
header h1{font-size:16px;font-weight:600;background:linear-gradient(135deg,var(--accent),var(--accent2));-webkit-background-clip:text;-webkit-text-fill-color:transparent}
header .badge{font-size:11px;padding:2px 8px;border-radius:10px;background:rgba(0,212,255,.12);color:var(--accent);border:1px solid rgba(0,212,255,.2)}
#status{margin-left:auto;font-size:12px;color:var(--muted)}
#chat{flex:1;overflow-y:auto;padding:20px;display:flex;flex-direction:column;gap:16px}
.msg{max-width:80%;padding:12px 16px;border-radius:12px;line-height:1.5;white-space:pre-wrap;word-break:break-word;font-size:14px}
.msg.user{align-self:flex-end;background:var(--user-bg);border:1px solid var(--border)}
.msg.assistant{align-self:flex-start;background:var(--bot-bg);border:1px solid var(--border)}
.msg.assistant .label{font-size:11px;color:var(--accent);margin-bottom:4px;font-weight:600}
.msg.user .label{font-size:11px;color:var(--muted);margin-bottom:4px;text-align:right}
.typing{align-self:flex-start;color:var(--muted);font-size:13px;padding:8px 0}
#input-area{display:flex;gap:10px;padding:16px 20px;border-top:1px solid var(--border);background:var(--surface)}
#prompt{flex:1;border:1px solid var(--border);background:var(--bg);color:var(--text);padding:10px 14px;border-radius:10px;font-size:14px;outline:none;resize:none;max-height:120px;font-family:inherit}
#prompt:focus{border-color:var(--accent);box-shadow:0 0 0 2px rgba(0,212,255,.15)}
#prompt::placeholder{color:var(--muted)}
#send{padding:10px 20px;border-radius:10px;border:none;background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;font-weight:600;cursor:pointer;font-size:14px;white-space:nowrap}
#send:hover{opacity:.9}
#send:disabled{opacity:.4;cursor:not-allowed}
@media(max-width:600px){.msg{max-width:92%}#input-area{padding:10px}header{padding:12px}}
</style>
</head>
<body>
<header>
  <h1>QuantoniumOS</h1>
  <span class="badge">R1-Distill-Qwen 7B · Q4_K_M · Mimosa KV</span>
  <span id="status">connecting…</span>
</header>

<div id="chat"></div>

<div id="input-area">
  <textarea id="prompt" rows="1" placeholder="Send a message…" autocomplete="off"></textarea>
  <button id="send" disabled>Send</button>
</div>

<script>
const chat = document.getElementById("chat");
const prompt = document.getElementById("prompt");
const sendBtn = document.getElementById("send");
const status = document.getElementById("status");
let history = [];
let busy = false;

prompt.addEventListener("input", () => {
  prompt.style.height = "auto";
  prompt.style.height = Math.min(prompt.scrollHeight, 120) + "px";
});

async function checkHealth() {
  try {
    const r = await fetch("/health");
    const j = await r.json();
    if (j.status === "ok") {
      status.textContent = "● connected";
      status.style.color = "#22c55e";
      sendBtn.disabled = false;
      return;
    }
  } catch {}
  status.textContent = "○ loading…";
  status.style.color = "#f59e0b";
  sendBtn.disabled = true;
  setTimeout(checkHealth, 2000);
}
checkHealth();

function addMessage(role, content) {
  const div = document.createElement("div");
  div.className = "msg " + role;
  const label = document.createElement("div");
  label.className = "label";
  label.textContent = role === "user" ? "You" : "DeepSeek R1 · 7B";
  div.appendChild(label);
  const body = document.createElement("span");
  body.className = "body";
  body.textContent = content;
  div.appendChild(body);
  chat.appendChild(div);
  chat.scrollTop = chat.scrollHeight;
  return body;
}

async function send() {
  const text = prompt.value.trim();
  if (!text || busy) return;
  busy = true;
  sendBtn.disabled = true;
  prompt.value = "";
  prompt.style.height = "auto";

  addMessage("user", text);
  history.push({ role: "user", content: text });

  const bodyEl = addMessage("assistant", "");
  const typing = document.createElement("div");
  typing.className = "typing";
  typing.textContent = "thinking…";
  chat.appendChild(typing);
  chat.scrollTop = chat.scrollHeight;

  try {
    const res = await fetch("/api/chat", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ messages: history, stream: true }),
    });

    typing.remove();
    const reader = res.body.getReader();
    const decoder = new TextDecoder();
    let full = "";
    let buf = "";

    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      buf += decoder.decode(value, { stream: true });
      const lines = buf.split("\n");
      buf = lines.pop();
      for (const line of lines) {
        if (!line.trim()) continue;
        try {
          const j = JSON.parse(line);
          if (j.message && j.message.content) {
            full += j.message.content;
            bodyEl.textContent = full;
            chat.scrollTop = chat.scrollHeight;
          }
        } catch {}
      }
    }
    history.push({ role: "assistant", content: full });
  } catch (err) {
    typing.remove();
    bodyEl.textContent = "[Error: " + err.message + "]";
  }
  busy = false;
  sendBtn.disabled = false;
  prompt.focus();
}

sendBtn.addEventListener("click", send);
prompt.addEventListener("keydown", (e) => {
  if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); send(); }
});
</script>
</body>
</html>
