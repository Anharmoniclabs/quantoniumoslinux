[package]
name = "quantoniumos-desktop"
version = "0.1.0"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sysinfo = "0.32"
sha2 = "0.10"
memmap2 = "0.9"
rayon = "1.10"
regex = "1.10"
bitflags = "2.6"
ureq = { version = "2.10", features = ["json"] }

[target.'cfg(windows)'.dependencies]
webview2-com = "0.38"
