# QuantoniumOS — Hyprland session (Omarchy-style keyboard-first tiling).
# Every launcher goes through qos-run, so apps run as RFTMW workloads in rftmw.slice
# (see `rftmwctl procs`, or hover the RFTMW module in the bar).
# Personal overrides: ~/.config/hypr/user.conf (sourced last).

monitor = , preferred, auto, auto

$terminal = qos-run -- alacritty
$browser  = qos-run --mem-high 4096 -- chromium --ozone-platform=wayland
$files    = qos-run -- nautilus --new-window
$launcher = fuzzel --launch-prefix="qos-run --"

env = XCURSOR_SIZE,24
env = QT_QPA_PLATFORM,wayland;xcb
env = GDK_BACKEND,wayland,x11
env = ELECTRON_OZONE_PLATFORM_HINT,auto

exec-once = dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP HYPRLAND_INSTANCE_SIGNATURE
exec-once = waybar
exec-once = mako
exec-once = hypridle
exec-once = systemctl --user start hyprpolkitagent
exec-once = swaybg -c 0b0f1a
exec-once = qos-desktop

general {
    gaps_in = 4
    gaps_out = 8
    border_size = 2
    col.active_border = rgba(7aa2f7ee) rgba(bb9af7ee) 45deg
    col.inactive_border = rgba(1a1b26aa)
    layout = dwindle
    resize_on_border = true
}

decoration {
    rounding = 8
    blur {
        enabled = true
        size = 6
        passes = 2
    }
}

animations {
    enabled = true
    bezier = ease, 0.25, 0.1, 0.25, 1
    animation = windows, 1, 4, ease, popin 80%
    animation = fade, 1, 4, ease
    animation = workspaces, 1, 4, ease, slide
}

input {
    kb_layout = us
    follow_mouse = 1
    touchpad {
        natural_scroll = true
    }
}

dwindle {
    pseudotile = true
    preserve_split = true
}

misc {
    disable_hyprland_logo = true
    disable_splash_rendering = true
}

# The QuantoniumOS shell owns workspace 1, fullscreen.
windowrule = workspace 1, class:^(quantoniumos-desktop)$
windowrule = fullscreen, class:^(quantoniumos-desktop)$

$mod = SUPER
bind = $mod, Return, exec, $terminal
bind = $mod, Space, exec, $launcher
bind = $mod, B, exec, $browser
bind = $mod, E, exec, $files
bind = $mod, Q, exec, qos-desktop
bind = $mod, W, killactive
bind = $mod, F, fullscreen
bind = $mod, T, togglefloating
bind = $mod, J, togglesplit
bind = $mod, Escape, exec, hyprlock
bind = $mod SHIFT, Escape, exit
# RFTMW: live workload/memory view, and drop idle model packs from RAM.
bind = $mod, M, exec, qos-run -- alacritty -e sh -c 'watch -n1 "rftmwctl stats | jq; rftmwctl procs | jq -r \".workloads[] | select(.running) | [.name, .memory_current] | @tsv\""'
bind = $mod SHIFT, M, exec, sh -c 'for id in $(rftmwctl pack.list | jq -r ".packs[] | select(.pinned|not) | .id"); do rftmwctl pack.evict $id; done; notify-send "RFTMW" "Idle packs evicted"'
bind = , Print, exec, grim -g "$(slurp)" - | wl-copy

bind = $mod, left, movefocus, l
bind = $mod, right, movefocus, r
bind = $mod, up, movefocus, u
bind = $mod, down, movefocus, d
bind = $mod SHIFT, left, movewindow, l
bind = $mod SHIFT, right, movewindow, r
bind = $mod SHIFT, up, movewindow, u
bind = $mod SHIFT, down, movewindow, d
bind = $mod, 1, workspace, 1
bind = $mod, 2, workspace, 2
bind = $mod, 3, workspace, 3
bind = $mod, 4, workspace, 4
bind = $mod, 5, workspace, 5
bind = $mod, 6, workspace, 6
bind = $mod SHIFT, 1, movetoworkspace, 1
bind = $mod SHIFT, 2, movetoworkspace, 2
bind = $mod SHIFT, 3, movetoworkspace, 3
bind = $mod SHIFT, 4, movetoworkspace, 4
bind = $mod SHIFT, 5, movetoworkspace, 5
bind = $mod SHIFT, 6, movetoworkspace, 6
bindm = $mod, mouse:272, movewindow
bindm = $mod, mouse:273, resizewindow
bindel = , XF86AudioRaiseVolume, exec, wpctl set-volume -l 1 @DEFAULT_AUDIO_SINK@ 5%+
bindel = , XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindl  = , XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindel = , XF86MonBrightnessUp, exec, brightnessctl s 5%+
bindel = , XF86MonBrightnessDown, exec, brightnessctl s 5%-

source = ~/.config/hypr/user.conf
