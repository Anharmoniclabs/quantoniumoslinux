# Transparent huge pages only where requested (madvise), with deferred defrag:
# avoids allocation stalls system-wide while letting inference buffers opt in.
w /sys/kernel/mm/transparent_hugepage/enabled - - - - madvise
w /sys/kernel/mm/transparent_hugepage/defrag  - - - - defer+madvise
w /sys/kernel/mm/transparent_hugepage/khugepaged/defrag - - - - 1
