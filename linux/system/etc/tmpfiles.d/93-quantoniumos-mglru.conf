# MGLRU thrashing protection (Documentation/admin-guide/mm/multigen_lru.rst):
# pages used within the last second are never evicted, so when memory runs out the
# kernel OOM-kills the largest offender instead of livelocking on refaults with an
# unresponsive desktop. rftmwd (OOMScoreAdjust=-500) and per-workload limits make
# the offender a workload rather than the session.
w- /sys/kernel/mm/lru_gen/enabled    - - - - y
w- /sys/kernel/mm/lru_gen/min_ttl_ms - - - - 1000
