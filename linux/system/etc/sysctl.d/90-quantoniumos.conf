# QuantoniumOS memory policy: model weights are large, read-mostly, file-backed
# mappings brokered by rftmwd; anonymous memory overflows to compressed zram.

# zram is far cheaper than re-reading weights from disk: favour swapping anon pages
# over dropping page cache (values >100 are valid with zram, see kernel docs).
vm.swappiness = 180
# zram has no seek cost; don't read ahead neighbouring swap pages.
vm.page-cluster = 0
# Wake kswapd earlier so allocations rarely hit direct reclaim stalls.
vm.watermark_boost_factor = 0
vm.watermark_scale_factor = 125
# Keep dentries/inodes for the weight packs around.
vm.vfs_cache_pressure = 50
# GGUF/rftmwpk loaders map many regions; the default 65530 is too low.
vm.max_map_count = 1048576
